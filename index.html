<meta name="mobile-web-app-capable" content="yes">

<title>Imposter Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Special+Elite&display=swap">
<style>
/* Layout: a glowing navy hero opens the setup screen, content sits in white panels on a cool desk, and every secret is a case file card with its own colour. Signal yellow is the single accent: logo, primary buttons, leader highlight. */
:root {
  --bg: #edf0f6;
  --surface: #ffffff;
  --ink: #11203a;
  --muted: #55657d;
  --line: #d3dae6;
  --tint: #e1e7f0;
  --accent: #f2b705;
  --on-accent: #11203a;
  --crew: #0e8a6a;
  --imp: #d42b3f;
  --crew-tint: #e0f4ec;
  --imp-tint: #fde7ea;
  --lead-tint: #fff1c2;
  --hero-a: #11203a;
  --hero-b: #2b3180;
  --on-hero: #f4f7fb;
  --hero-muted: #aab7d0;
  --glow: rgba(242, 183, 5, 0.38);
  --shadow: rgba(17, 32, 58, 0.30);
  --wash-a: rgba(242, 183, 5, 0.16);
  --wash-b: rgba(70, 80, 200, 0.10);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-type: "Special Elite", "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1322;
    --surface: #14233a;
    --ink: #e7edf6;
    --muted: #93a3ba;
    --line: #26395a;
    --tint: #1b2e4a;
    --accent: #f5c21b;
    --on-accent: #0c1626;
    --crew: #35c79f;
    --imp: #ff5a6b;
    --crew-tint: #123a30;
    --imp-tint: #3a1b27;
    --lead-tint: #3a3413;
    --hero-a: #15264a;
    --hero-b: #2f3590;
    --hero-muted: #b2bfd6;
    --glow: rgba(245, 194, 27, 0.30);
    --shadow: rgba(0, 0, 0, 0.55);
    --wash-a: rgba(245, 194, 27, 0.08);
    --wash-b: rgba(90, 100, 230, 0.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1322;
  --surface: #14233a;
  --ink: #e7edf6;
  --muted: #93a3ba;
  --line: #26395a;
  --tint: #1b2e4a;
  --accent: #f5c21b;
  --on-accent: #0c1626;
  --crew: #35c79f;
  --imp: #ff5a6b;
  --crew-tint: #123a30;
  --imp-tint: #3a1b27;
  --lead-tint: #3a3413;
  --hero-a: #15264a;
  --hero-b: #2f3590;
  --hero-muted: #b2bfd6;
  --glow: rgba(245, 194, 27, 0.30);
  --shadow: rgba(0, 0, 0, 0.55);
  --wash-a: rgba(245, 194, 27, 0.08);
  --wash-b: rgba(90, 100, 230, 0.16);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(60% 36% at 0% 0%, var(--wash-a), transparent 70%),
    radial-gradient(60% 36% at 100% 0%, var(--wash-b), transparent 70%);
  background-repeat: no-repeat;
  color: var(--ink);
  font: 16px/1.45 var(--font-body);
  padding-inline: 16px;
  padding-block: 18px 0;
}
.wrap {
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding-bottom: 24px;
}
h1, h2, p, dl, dd, ol, ul { margin: 0; }
h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(2.2rem, 10vw, 3.1rem);
  line-height: 1.02;
  letter-spacing: -0.025em;
  text-wrap: balance;
  overflow-wrap: anywhere;
}
h2 {
  font-family: var(--font-type);
  font-weight: 400;
  font-size: 0.85rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.eyebrow, .label {
  font-family: var(--font-type);
  font-size: 0.8rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.lede { color: var(--muted); max-width: 60ch; text-wrap: pretty; }
.head { display: flex; flex-direction: column; gap: 12px; }
.count { font-family: var(--font-type); color: var(--muted); font-variant-numeric: tabular-nums; }
.section { display: flex; flex-direction: column; gap: 12px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* Logo and brand bar */
.logo { display: block; flex: none; border-radius: 22%; box-shadow: 0 8px 20px -10px var(--shadow); }
.brandbar { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em; }

/* Hero */
.hero {
  position: relative;
  overflow: hidden;
  color: var(--on-hero);
  background:
    radial-gradient(90% 120% at 100% 0%, var(--glow), transparent 55%),
    linear-gradient(150deg, var(--hero-a), var(--hero-b));
  border-radius: 24px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 18px 40px -22px var(--shadow);
}
.hero h1 { color: var(--on-hero); font-size: clamp(2.4rem, 11vw, 3.3rem); }
.hero-top { display: flex; align-items: center; gap: 14px; min-width: 0; }
.hero .eyebrow { color: var(--hero-muted); }
.hero-lede { color: var(--hero-muted); max-width: 46ch; text-wrap: pretty; }
.avrow { display: flex; align-items: center; padding-left: 8px; }
.avrow .av { margin-left: -8px; border: 2px solid var(--hero-b); width: 36px; height: 36px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  font-family: var(--font-type); font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 5px 11px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.13); color: var(--on-hero);
}
.pill.imp { background: var(--accent); color: var(--on-accent); }

/* Avatars */
.av {
  display: inline-grid; place-items: center; flex: none;
  width: 40px; height: 40px; border-radius: 50%;
  background: hsl(var(--h) 55% 40%);
  color: #ffffff;
  font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; letter-spacing: 0;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.2);
}
.av.sm { width: 32px; height: 32px; font-size: 0.8rem; }
.av.lg { width: 60px; height: 60px; font-size: 1.3rem; }
.av.xl { width: 92px; height: 92px; font-size: 2rem; }

/* Panels */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 16px;
  box-shadow: 0 14px 30px -24px var(--shadow);
  display: flex; flex-direction: column; gap: 12px;
}

/* Players */
.plist { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.prow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.pname {
  width: 100%; min-width: 0;
  font: inherit; font-size: 16px;
  padding: 11px 12px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--ink);
}
.pname::placeholder { color: var(--muted); opacity: 0.8; }
.icon-btn {
  width: 42px; height: 42px;
  border: 1px solid var(--line); border-radius: 10px;
  background: transparent; color: var(--muted);
  font: inherit; font-size: 1.3rem; line-height: 1;
  cursor: pointer;
}
.icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }

/* Buttons */
.btn {
  font: inherit; font-weight: 700;
  min-height: 50px; padding: 12px 18px;
  border: 0; border-radius: 14px;
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; text-align: center;
  transition: transform 0.08s ease;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 12px 22px -12px var(--shadow); }
.btn-soft { background: var(--tint); color: var(--ink); }
.btn-link { background: none; color: var(--muted); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; min-height: 40px; padding: 8px 10px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 0.95rem; font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  border: 1px solid var(--line); border-radius: 999px;
  background: transparent; color: var(--ink);
  cursor: pointer;
}
.chip small { font-family: var(--font-type); font-size: 0.75rem; opacity: 0.7; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cdot { width: 9px; height: 9px; border-radius: 50%; background: hsl(var(--h) 70% 52%); flex: none; }

/* Sticky action bar */
.actionbar {
  position: sticky; bottom: 0;
  margin-inline: -16px;
  padding: 16px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 75%, transparent);
  display: flex; flex-direction: column; gap: 8px;
}
.note { font-size: 0.9rem; color: var(--muted); text-align: center; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.row > .btn { flex: 1 1 8rem; }

details { border-top: 1px solid var(--line); padding-top: 14px; }
summary { cursor: pointer; font-weight: 700; }
details ol { padding-left: 1.2rem; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; color: var(--muted); }

/* Reveal: the case file */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink); }
.dot.done { background: var(--ink); }
.dot.now { background: var(--accent); border-color: var(--accent); }
.file { position: relative; margin-top: 18px; perspective: 1100px; }
.file-tab {
  position: absolute; left: 16px; top: -26px;
  background: var(--accent); color: var(--on-accent);
  font-family: var(--font-type); font-size: 0.8rem; letter-spacing: 0.1em;
  padding: 5px 12px; border-radius: 8px 8px 0 0;
}
.file-body {
  width: 100%;
  min-height: min(62vh, 420px);
  padding: 28px 20px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; text-align: center;
  font: inherit; color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--ink);
  border-radius: 4px 22px 22px 22px;
  box-shadow: 0 24px 40px -26px var(--shadow);
}
button.file-body { cursor: pointer; }
.file-body.closed {
  border: 0;
  color: var(--on-hero);
  background:
    radial-gradient(90% 80% at 85% 0%, var(--glow), transparent 60%),
    linear-gradient(150deg, var(--hero-a), var(--hero-b));
}
.file-body.closed .label { color: var(--hero-muted); }
.tap {
  font-weight: 700; font-size: 1.05rem;
  padding: 11px 20px; border-radius: 999px;
  background: var(--accent); color: var(--on-accent);
}
.file-body.open { animation: flip 0.5s ease-out both; }
.file-body.crew { border-color: var(--crew); border-width: 3px; background: linear-gradient(165deg, var(--surface), var(--crew-tint)); }
.file-body.imp { border-color: var(--imp); border-width: 3px; background: linear-gradient(165deg, var(--surface), var(--imp-tint)); }
@keyframes flip { from { transform: rotateY(80deg); opacity: 0; } to { transform: rotateY(0); opacity: 1; } }
.secret {
  font-family: var(--font-display); font-weight: 800;
  font-size: clamp(2.3rem, 13vw, 3.6rem);
  line-height: 1.02; letter-spacing: -0.02em;
  text-wrap: balance; overflow-wrap: anywhere; max-width: 100%;
}
.secret.sm { font-size: clamp(1.9rem, 10vw, 2.6rem); }
.hintline { font-weight: 600; font-size: 1.3rem; line-height: 1.3; text-wrap: balance; overflow-wrap: anywhere; max-width: 100%; }
.clue {
  font-weight: 700; font-size: 1.3rem; line-height: 1.3; text-wrap: balance; overflow-wrap: anywhere;
  max-width: 100%; padding: 14px 16px;
  border: 2px dashed var(--imp); border-radius: 14px; background: var(--surface);
}
.small { font-size: 0.95rem; color: var(--muted); max-width: 30ch; }
.stamp {
  display: inline-block;
  font-family: var(--font-type); text-transform: uppercase;
  letter-spacing: 0.14em; font-size: 1.15rem;
  border: 3px solid currentColor; border-radius: 6px;
  padding: 4px 14px;
  transform: rotate(-5deg);
  animation: slam 0.28s ease-out both;
}
.stamp.crew { color: var(--crew); }
.stamp.imp { color: var(--imp); }
@keyframes slam {
  from { transform: rotate(-5deg) scale(1.6); opacity: 0; }
  to { transform: rotate(-5deg) scale(1); opacity: 1; }
}

/* Discussion */
.speaker { display: flex; align-items: center; gap: 14px; min-width: 0; }
.speaker h1 { font-size: clamp(1.8rem, 8vw, 2.5rem); }
.timer { align-items: center; text-align: center; }
.ring { position: relative; width: 190px; height: 190px; max-width: 100%; }
.ring svg { width: 100%; height: 100%; display: block; }
.ring-bg { fill: none; stroke: var(--tint); stroke-width: 9; }
.ring-fg { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset 0.25s linear; }
.ring-fg.low { stroke: var(--imp); }
.clock {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800;
  font-size: 2.8rem; line-height: 1; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.timer .row { width: 100%; }

/* Voting */
.vopts { display: flex; flex-direction: column; gap: 8px; }
.vopt {
  font: inherit; font-weight: 600; font-size: 1.05rem; text-align: left;
  min-height: 60px; padding: 10px 14px;
  display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: center; gap: 12px;
  border: 1px solid var(--line); border-radius: 16px;
  background: var(--surface); color: var(--ink);
  cursor: pointer; overflow-wrap: anywhere;
}
.vopt[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); box-shadow: 0 12px 24px -14px var(--shadow); }

/* Result */
.verdict { align-items: center; text-align: center; gap: 12px; }
.verdict.panel { border: 2px solid var(--imp); background: linear-gradient(165deg, var(--surface), var(--imp-tint)); padding: 24px 16px; }
.banner { font-weight: 700; font-size: 1.2rem; line-height: 1.3; text-wrap: balance; }
.banner.win { color: var(--crew); }
.banner.lose { color: var(--imp); }
.tally { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.tally li { display: grid; grid-template-columns: 32px minmax(0, 6rem) minmax(0, 1fr) 1.6rem; align-items: center; gap: 10px; }
.tally .nm { font-weight: 600; font-size: 0.95rem; overflow-wrap: anywhere; }
.tally .bar { height: 12px; background: var(--tint); border-radius: 999px; overflow: hidden; }
.tally .bar i { display: block; height: 100%; background: var(--ink); border-radius: 999px; }
.tally li.is-imp .bar i { background: var(--imp); }
.tally li.is-imp .nm { color: var(--imp); }
.tally .ct { font-family: var(--font-type); text-align: right; font-variant-numeric: tabular-nums; }
.score { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.score li {
  display: grid; grid-template-columns: 1.4rem 32px minmax(0, 1fr) 2.4rem 2.8rem; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 14px; background: var(--bg);
}
.score li.lead { background: var(--lead-tint); box-shadow: inset 0 0 0 2px var(--accent); }
.score .rk { font-family: var(--font-type); color: var(--muted); }
.score .nm { font-weight: 600; overflow-wrap: anywhere; }
.score .gain { font-family: var(--font-type); font-size: 0.9rem; color: var(--crew); text-align: right; }
.score .pts { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; line-height: 1; text-align: right; font-variant-numeric: tabular-nums; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px 18px; }
.facts dd { font-weight: 600; overflow-wrap: anywhere; }
.facts dt { align-self: baseline; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 12px; font-weight: 600; text-align: center;
  z-index: 10;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

</head>

  try {
    var d = JSON.parse(localStorage.getItem(KEY) || "null");
    if (d) {
      if (Array.isArray(d.names) && d.names.length >= MINP && d.names.length <= MAXP) {
        S.players = d.names.map(function (n, i) { return { name: String(n), score: (d.scores && +d.scores[i]) || 0 }; });
      }
      if (Array.isArray(d.cats)) {
        var cs = d.cats.filter(function (k) { return DATA[k]; });
        if (cs.length) S.cats = new Set(cs);

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        names: S.players.map(function (p) { return p.name; }),
        scores: S.players.map(function (p) { return p.score || 0; }),
        cats: Array.from(S.cats), timer: S.timer
      }));
    } catch (e) {}
  }

  function rnd(n) {
    try {
      var a = new Uint32Array(1);
      crypto.getRandomValues(a);
      return a[0] % n;
    } catch (e) { return Math.floor(Math.random() * n); }
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function nameOf(i) { return (S.players[i].name || "").trim() || ("Player " + (i + 1)); }
  function pad(n) { return String(n).padStart(3, "0"); }
  function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  /* Round logic: one imposter, everyone else shares the word */
  function pool() {
    var out = [];
    S.cats.forEach(function (k) {
      DATA[k].items.forEach(function (it) {
        if (!S.used.has(k + "|" + it.w)) out.push({ k: k, w: it.w, h: it.h });
      });
    });
    return out;
  }
  function startRound() {
    var p = pool();
    if (!p.length) {
      S.cats.forEach(function (k) { DATA[k].items.forEach(function (it) { S.used.delete(k + "|" + it.w); }); });
      p = pool();
    }
    var pick = p[rnd(p.length)];
    S.used.add(pick.k + "|" + pick.w);
    S.round++;
    S.cur = {
      word: pick.w, hint: pick.h, cat: DATA[pick.k].label,
      imp: rnd(S.players.length), first: rnd(S.players.length)
    };
    S.step = 0; S.revealed = false; S.phase = "reveal";
    S.votes = []; S.voteStep = 0; S.pick = -1; S.outcome = null;
    stopTimer(); S.timerLeft = S.timer * 60;
  }

  /* Timer */
  var tick = null;
  function stopTimer() { clearInterval(tick); tick = null; S.timerRun = false; }
  function upd() {
    S.timerLeft = Math.max(0, Math.ceil((S.timerEnd - Date.now()) / 1000));
    var c = document.getElementById("clock");
    if (c) c.textContent = fmt(S.timerLeft);
    var rg = document.getElementById("ring");
    if (rg) {
      rg.setAttribute("stroke-dashoffset", ringOff());
      rg.setAttribute("class", "ring-fg" + (S.timerLeft <= 10 ? " low" : ""));
    }
    if (S.timerLeft === 0) {
      stopTimer();
      try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
      render();
    }
  }
  function tStart() {
    if (S.timerLeft <= 0) S.timerLeft = S.timer * 60;
    S.timerEnd = Date.now() + S.timerLeft * 1000;
    S.timerRun = true;
    clearInterval(tick); tick = setInterval(upd, 250);
    render();
  }

  }

  function vReveal() {
    var c = S.cur, i = S.step, n = S.players.length, name = esc(nameOf(i)), isImp = i === c.imp, last = i === n - 1;
    var dots = S.players.map(function (p, j) {
      return '<span class="dot ' + (j < i ? "done" : j === i ? "now" : "") + '"></span>';
    }).join("");
    var top = '<div class="topbar"><span class="eyebrow">Round ' + S.round + " &middot; Player " + (i + 1) + " of " + n +
      '</span><button class="btn btn-link" data-a="skip">Skip round</button></div><div class="dots" aria-hidden="true">' + dots + "</div>";
    var tab = '<span class="file-tab">CASE FILE ' + pad(S.round) + "</span>";
    if (!S.revealed) {
      return top + '<div class="file">' + tab + '<button class="file-body closed" data-a="reveal">' + av(i, "xl") +
        '<span class="label">Hand the phone to</span><span class="secret sm">' + name + "</span>" +
        '<span class="tap">Tap to open your file</span><span class="label">Keep the screen hidden from everyone else</span></button></div>';
    }
    var card = isImp
      ? '<div class="file-body open imp"><span class="stamp imp">Imposter</span><span class="label">Category &middot; ' + esc(c.cat) +
        '</span><span class="label">Your only clue</span><span class="clue">' + esc(c.hint) +
        '</span><span class="small">You do not know the word. Listen closely, then blend in.</span></div>'
      : '<div class="file-body open crew"><span class="stamp crew">Crew</span><span class="label">Category &middot; ' + esc(c.cat) +
        '</span><span class="label">The secret word</span><span class="secret">' + esc(c.word) + "</span></div>";
    var btn = last ? "Hide file and start discussion" : "Hide file, pass to " + esc(nameOf(i + 1));
    return top + '<div class="file">' + tab + card + "</div>" +
      '<button class="btn btn-primary btn-block" data-a="hide">' + btn + "</button>";
  }

  function vPlay() {
    var c = S.cur, timer = "";
    if (S.timer > 0) {
      var started = S.timerLeft < S.timer * 60;
      var msg = S.timerLeft === 0 ? "Time is up. Vote now." : S.timerRun ? "Discussion running" : started ? "Paused" : "Ready when you are";
      timer = '<section class="panel timer" aria-label="Discussion timer"><div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true">' +
        '<circle class="ring-bg" cx="60" cy="60" r="54"/><circle class="ring-fg' + (S.timerLeft <= 10 && started ? " low" : "") +
        '" id="ring" cx="60" cy="60" r="54" stroke-dasharray="' + RC + '" stroke-dashoffset="' + ringOff() + '" transform="rotate(-90 60 60)"/></svg>' +
        '<div class="clock" id="clock">' + fmt(S.timerLeft) + '</div></div><p class="label">' + msg + '</p><div class="row">' +
        '<button class="btn btn-soft" data-a="' + (S.timerRun ? "tpause" : "tstart") + '">' +
        (S.timerRun ? "Pause" : started && S.timerLeft > 0 ? "Resume" : "Start timer") + "</button>" +
        '<button class="btn btn-soft" data-a="treset">Reset</button></div></section>';
    }
    return '<header class="head"><p class="eyebrow">Round ' + S.round + ' &middot; Discussion</p>' +
      '<div class="speaker">' + av(c.first, "lg") + '<div><p class="label">Speaks first</p><h1>' + esc(nameOf(c.first)) + "</h1></div></div>" +
      '<p class="lede">Go around the group. Give one short clue about the word each. Keep it vague enough that the imposter cannot copy it.</p></header>' +
      timer +
      '<div class="actionbar"><button class="btn btn-primary btn-block" data-a="startvote">Start voting</button>' +
      '<div class="row"><button class="btn btn-soft" data-a="skip">Skip round</button><button class="btn btn-soft" data-a="setup">Players &amp; categories</button></div>' +
      '<button class="btn btn-link" data-a="show">Reveal without voting</button>' +
      '<p class="note">Skipping gives a new word and a new imposter. Skipped rounds give no points.</p></div>';
  }

  function vVote() {
    var i = S.voteStep, n = S.players.length, last = i === n - 1;
    var opts = S.players.map(function (p, j) {
      if (j === i) return "";
      return '<button class="vopt" data-a="pick" data-i="' + j + '" aria-pressed="' + (S.pick === j) + '">' + av(j, "") + "<span>" + esc(nameOf(j)) + "</span></button>";
    }).join("");
    var label = last ? "Lock vote and see result" : "Lock vote, pass to " + esc(nameOf(i + 1));
    return '<div class="topbar"><span class="eyebrow">Round ' + S.round + " &middot; Vote " + (i + 1) + " of " + n +
      '</span><button class="btn btn-link" data-a="skip">Skip round</button></div>' +
      '<header class="head"><div class="speaker">' + av(i, "lg") + '<div><p class="label">Phone is with</p><h1>' + esc(nameOf(i)) + "</h1></div></div>" +
      '<p class="lede">Who is the imposter? Pick one player and keep your vote hidden from the others.</p></header>' +
      '<div class="vopts">' + opts + "</div>" +
      '<div class="actionbar"><button class="btn btn-primary btn-block" data-a="lock"' + (S.pick < 0 ? " disabled" : "") + ">" + label + "</button></div>";
  }

  function finishVote() {
    var n = S.players.length, imp = S.cur.imp, tally = [], gains = [], j;
    for (j = 0; j < n; j++) { tally.push(0); gains.push(0); }
    S.votes.forEach(function (v, k) { tally[v]++; if (v === imp) gains[k] += 1; });
    var max = Math.max.apply(null, tally), leaders = [];
    tally.forEach(function (t, k) { if (t === max) leaders.push(k); });
    var accused = leaders.length === 1 ? leaders[0] : -1, caught = accused === imp;
    if (!caught) gains[imp] += 2;
    S.players.forEach(function (p, k) { p.score = (p.score || 0) + gains[k]; });
    S.outcome = { tally: tally, accused: accused, caught: caught, gains: gains };
    S.phase = "result";
    save();
  }

  function vResult() {
    var c = S.cur, o = S.outcome, n = S.players.length;
    var head = '<header class="verdict panel">' + av(c.imp, "xl") + '<span class="stamp imp">The imposter</span><h1>' + esc(nameOf(c.imp)) + "</h1>";
    if (o) {
      var msg = o.caught ? "Caught. The crew found the imposter."
        : o.accused < 0 ? "Tie vote, so nobody was accused. The imposter escapes."
        : esc(nameOf(o.accused)) + " was accused but was crew. The imposter escapes.";
      head += '<p class="banner ' + (o.caught ? "win" : "lose") + '">' + msg + "</p>";
    }
    head += "</header>";
    var tally = "";
    if (o) {
      tally = '<section class="panel" aria-labelledby="h-tally"><h2 id="h-tally">Votes</h2><ul class="tally">' +
        S.players.map(function (p, j) {
          var w = Math.round(o.tally[j] / Math.max(1, n - 1) * 100);
          return '<li class="' + (j === c.imp ? "is-imp" : "") + '">' + av(j, "sm") + '<span class="nm">' + esc(nameOf(j)) +
            '</span><span class="bar"><i style="width:' + w + '%"></i></span><span class="ct">' + o.tally[j] + "</span></li>";
        }).join("") + "</ul></section>";
    }
    var facts = '<section class="panel"><dl class="facts"><dt class="label">Secret word</dt><dd>' + esc(c.word) +
      '</dd><dt class="label">Imposter hint</dt><dd>' + esc(c.hint) + '</dd><dt class="label">Category</dt><dd>' + esc(c.cat) + "</dd></dl></section>";
    var score = "";
    if (o || anyScore()) {
      score = '<section class="panel" aria-labelledby="h-score"><h2 id="h-score">Scoreboard</h2>' + board(o ? o.gains : null) +
        '<p class="note">' + (o ? "+1 for each correct vote. +2 for the imposter if they escape."
          : "This round was revealed without voting, so no points were given.") + "</p></section>";
    }
    return head + tally + facts + score +
      '<div class="actionbar"><button class="btn btn-primary btn-block" data-a="next">Next round</button>' +
      '<button class="btn btn-soft btn-block" data-a="setup">Players &amp; categories</button></div>';
  }

  var lastPhase = "";
  function render() {
    var views = { setup: vSetup, reveal: vReveal, vote: vVote, play: vPlay, result: vResult };
    var pre = (S.phase === "play" || S.phase === "vote" || S.phase === "result") ? brandBar() : "";
    $app.innerHTML = pre + views[S.phase]();
    var key = S.phase + (S.phase === "vote" ? S.voteStep : S.phase === "reveal" ? S.step + "" + S.revealed : "");
    if (key !== lastPhase) window.scrollTo(0, 0);
    lastPhase = key;
  }

  function act(a, ds) {
    if (a !== "resetscores") S.confirmReset = false;
    switch (a) {
      case "add":
        if (S.players.length < MAXP) {
          S.players.push({ name: "", score: 0 }); save(); render();
          var ins = $app.querySelectorAll(".pname");
          if (ins.length) ins[ins.length - 1].focus();
        }
        return;
      case "rm":
        if (S.players.length > MINP) { S.players.splice(+ds.i, 1); save(); render(); }
        return;
      case "tcat":
        if (S.cats.has(ds.k)) S.cats.delete(ds.k); else S.cats.add(ds.k);
        save(); render(); return;
      case "catall": S.cats = new Set(KEYS); save(); render(); return;
      case "catnone": S.cats = new Set(); save(); render(); return;
      case "timer": S.timer = +ds.v; save(); render(); return;
      case "start":
      case "next":
        if (S.players.length >= MINP && S.cats.size) { startRound(); render(); }
        return;
      case "skip":
        startRound(); render(); toast("Round skipped. New word, new imposter."); return;
      case "reveal": S.revealed = true; render(); return;
      case "hide":
        S.revealed = false; S.step++;
        if (S.step >= S.players.length) { S.phase = "play"; S.timerLeft = S.timer * 60; }
        render(); return;
      case "show": stopTimer(); S.outcome = null; S.phase = "result"; render(); return;
      case "startvote":
        stopTimer(); S.votes = []; S.voteStep = 0; S.pick = -1; S.phase = "vote"; render(); return;
      case "pick": S.pick = +ds.i; render(); return;
      case "lock":
        if (S.pick < 0) return;
        S.votes[S.voteStep] = S.pick; S.pick = -1; S.voteStep++;
        if (S.voteStep >= S.players.length) finishVote();
        render(); return;
      case "resetscores":
        if (!S.confirmReset) { S.confirmReset = true; render(); return; }
        S.confirmReset = false;
        S.players.forEach(function (p) { p.score = 0; });
        save(); render(); toast("Scores reset."); return;
      case "setup": stopTimer(); S.phase = "setup"; render(); return;
      case "tstart": tStart(); return;
      case "tpause": upd(); stopTimer(); render(); return;
      case "treset": stopTimer(); S.timerLeft = S.timer * 60; render(); return;
    }
  }

  $app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-a]");
    if (!b || b.disabled) return;
    act(b.dataset.a, b.dataset);
  });
  $app.addEventListener("input", function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains("pname")) {
      S.players[+t.dataset.i].name = t.value;
      var pa = document.getElementById("pav-" + t.dataset.i);
      if (pa) pa.textContent = initials(+t.dataset.i);
      save();
    }
  });

  render();
})();
</script>

<script>
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
